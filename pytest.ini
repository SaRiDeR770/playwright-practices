[pytest]
testpaths = tests
addopts =
    --alluredir=allure-results
    --clean-alluredir
    --browser chromium
    --screenshot only-on-failure
    --video retain-on-failure
    --tracing retain-on-failure
    -p no:cacheprovider
markers =
    ui: browser tests (Playwright)
    api: HTTP tests (httpx)
